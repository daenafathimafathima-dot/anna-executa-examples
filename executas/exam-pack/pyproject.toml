[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-brightlabs-fathima-exam-pack-gp65mmhm"
version = "0.1.1"
description = "Executa for the exam-pack Anna App"
requires-python = ">=3.10"
dependencies = ["executa-sdk>=0.1.0"]

[tool.uv.sources]
executa-sdk = { path = "../../sdk/python", editable = true }

[project.scripts]
"tool-brightlabs-fathima-exam-pack-gp65mmhm" = "exam_pack_plugin:main"

[tool.setuptools]
py-modules = ["exam_pack_plugin"]


